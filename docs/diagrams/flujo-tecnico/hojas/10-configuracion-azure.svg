   <g id="text_2">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="42.519685" y="53.610424" transform="rotate(-0 42.519685 53.610424)">RAG MANUAL / FLUJO TÉCNICO IMPLEMENTADO</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="84.028371" transform="rotate(-0 42.519685 84.028371)">Configuración: Azure y GitHub Actions</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="110.445603" transform="rotate(-0 42.519685 110.445603)">Terraform configura la API; GitHub Environments configura los jobs. Son ámbitos distintos.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="576.562451" transform="rotate(-0 42.519685 576.562451)">Código revisado: 13 septiembre 2026 · A4 horizontal</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="53.858268" y="160.71025" transform="rotate(-0 53.858268 160.71025)">Terraform → recursos, outputs e inputs</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 177.01954)">Endpoints Search/OpenAI y nombre del deployment.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 188.977196)">Inputs: entra_tenant_id, API/FE client IDs.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 201.732977)">Secret API: TF_VAR_entra_api_client_secret o creación opcional.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="450.708661" y="160.71025" transform="rotate(-0 450.708661 160.71025)">GitHub → Environments: evaluation / production</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 176.842977)">vars: AZURE_CLIENT_ID, AZURE_TENANT_ID,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 189.078759)">AZURE_SUBSCRIPTION_ID; desde Azure/outputs.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 201.31454)">evaluation: EVAL_AZURE_* desde recursos/outputs.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 213.550321)">production: nombres ACR, imagen, RG y Container App.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="53.858268" y="299.607887" transform="rotate(-0 53.858268 299.607887)">Container Apps → env y secretRef</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 315.740615)">env: APP_AZURE_*, APP_ENTRA_* IDs, APP_ENVIRONMENT.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 327.976396)">Secret: entra-api-client-secret.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 339.934053)">env APP_ENTRA_API_CLIENT_SECRET → referencia al secret.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 352.169834)">Terraform inyecta valores; no copia el .env local.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="450.708661" y="299.607887" transform="rotate(-0 450.708661 299.607887)">GitHub Actions → environment del runner</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 315.917178)">Workflow mapea vars.EVAL_AZURE_* a APP_AZURE_*.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 328.672959)">azure/login OIDC → identidades eval / producción.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 340.630615)">Eval: Search + OpenAI. Prod: build ACR + update app.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 352.588271)">Este workflow no usa client secret de Azure.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="53.858268" y="466.851982" transform="rotate(-0 53.858268 466.851982)">FastAPI → Settings → JWT/OBO/clientes</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="53.858268" y="483.161272" transform="rotate(-0 53.858268 483.161272)">Variables del proceso prevalecen sobre defaults.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="450.708661" y="467.283982" transform="rotate(-0 450.708661 467.283982)">CI → imagen aprobada → nueva revisión</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="450.708661" y="483.161272" transform="rotate(-0 450.708661 483.161272)">CI actualiza la imagen; Terraform mantiene los env.</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="534.84261" transform="rotate(-0 42.519685 534.84261)">Key Vault está preparado, sin conexión actual como fuente de env. Streamlit configura su TOML y URL API en su hosting.</text>
   </g>
  </g>
 </g>
