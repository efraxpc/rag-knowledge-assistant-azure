   <g id="text_2">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="42.519685" y="53.610424" transform="rotate(-0 42.519685 53.610424)">RAG MANUAL / FLUJO TÉCNICO IMPLEMENTADO</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="83.228371" transform="rotate(-0 42.519685 83.228371)">RBAC: autorización sobre los recursos</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="110.445603" transform="rotate(-0 42.519685 110.445603)">RBAC = principal + rol + scope del recurso. Se evalúa en el servicio Azure.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="576.562451" transform="rotate(-0 42.519685 576.562451)">Código revisado: 13 septiembre 2026 · A4 horizontal</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="53.858268" y="160.71025" transform="rotate(-0 53.858268 160.71025)">Entra emite un token OBO para cada destinatario</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 177.01954)">Principal: usuario (oid) y sus grupos. El secreto identifica a la API en el intercambio.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 188.977196)">El rol de la identidad de Container Apps no sustituye los permisos del usuario.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="53.858268" y="265.592139" transform="rotate(-0 53.858268 265.592139)">Azure AI Search · Roles de datos</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 281.90143)">Principal: grupo autorizado de Entra.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 293.859086)">Rol: Search Index Data Contributor (carga/consulta).</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 305.816742)">Scope: recurso Search; se asigna en Access control (IAM).</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 317.774398)">TF: search_user_group_object_id = Object ID del grupo.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="450.708661" y="265.592139" transform="rotate(-0 450.708661 265.592139)">Azure OpenAI · Rol de datos</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 281.90143)">Principal: usuario o grupo autorizado de Entra.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 293.859086)">Rol: Cognitive Services OpenAI User.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 305.816742)">Scope: cuenta Azure OpenAI; Access control (IAM).</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 317.774398)">TF: openai_user_object_ids = Object IDs de usuarios.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(190.905623 412.436059)">Token + rol</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(189.936091 423.633872)">¿autorizan?</text>
   </g>
