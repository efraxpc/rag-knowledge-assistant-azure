   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 264.893556)">RS256 + kid; firma, iss, aud estricto; exp/iat/nbf (leeway: 30 s).</text>
