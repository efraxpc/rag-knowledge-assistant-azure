   <g id="text_2">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="42.519685" y="53.610424" transform="rotate(-0 42.519685 53.610424)">RAG MANUAL / FLUJO TÉCNICO IMPLEMENTADO</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="84.028371" transform="rotate(-0 42.519685 84.028371)">Configuración: archivos y procesos locales</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="110.445603" transform="rotate(-0 42.519685 110.445603)">Archivos en la raíz del proyecto; Settings y st.secrets leen configuraciones distintas.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="576.562451" transform="rotate(-0 42.519685 576.562451)">Código revisado: 13 septiembre 2026 · A4 horizontal</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="53.858268" y="163.544895" transform="rotate(-0 53.858268 163.544895)">.env.example → .env</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 179.854186)">Copiar y completar APP_ENTRA_*, APP_AZURE_* y URL API.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 192.609967)">Origen: registros Entra, recursos/índices y deployments.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 204.567623)">Pydantic lo lee; el launcher no exporta todo el archivo.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="450.708661" y="163.544895" transform="rotate(-0 450.708661 163.544895)">.streamlit/secrets.toml.example → secrets.toml</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 179.854186)">[auth]: redirect_uri, cookie_secret, expose_tokens.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 192.089967)">[auth.microsoft]: client_id, client_secret, metadata,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 204.325748)">scope OIDC + api://&lt;api-id&gt;/access_as_user.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="53.858268" y="310.94647" transform="rotate(-0 53.858268 310.94647)">get_settings() → Settings(BaseSettings)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 327.25576)">Prioridad: environment del proceso &gt; .env &gt; defaults.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 339.733417)">env_prefix = APP_; valida IDs, endpoints y configuración.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="450.708661" y="310.94647" transform="rotate(-0 450.708661 310.94647)">Streamlit → st.secrets / st.login()</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 327.25576)">Lee el TOML para OIDC. Frontend secret: valor de Entra.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 339.213417)">cookie_secret: aleatorio local, no viene de Azure.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="53.858268" y="444.174816" transform="rotate(-0 53.858268 444.174816)">Procesos: Uvicorn + Streamlit</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 460.484107)">FastAPI: settings → JWT, OBO, Search y OpenAI.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 472.441763)">Streamlit: settings.api_base_url → destino HTTP.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="450.708661" y="444.174816" transform="rotate(-0 450.708661 444.174816)">Sesión Microsoft → access token API</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 460.484107)">expose_tokens = [access]; require_login() lo obtiene.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 473.239888)">Token generado en sesión: no se escribe en .env.</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="531.627964" transform="rotate(-0 42.519685 531.627964)">run_local.sh exporta APP_API_BASE_URL desde host/puerto o environment existente; prevalece sobre .env.</text>
   </g>
  </g>
 </g>
