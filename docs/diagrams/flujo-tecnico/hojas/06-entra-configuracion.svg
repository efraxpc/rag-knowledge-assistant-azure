   <g id="text_2">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="42.519685" y="53.610424" transform="rotate(-0 42.519685 53.610424)">RAG MANUAL / FLUJO TÉCNICO IMPLEMENTADO</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="83.228371" transform="rotate(-0 42.519685 83.228371)">Entra ID: registros y consentimiento</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="110.445603" transform="rotate(-0 42.519685 110.445603)">Configuración previa: dos registros distintos, permisos delegados y consentimiento.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="576.562451" transform="rotate(-0 42.519685 576.562451)">Código revisado: 13 septiembre 2026 · A4 horizontal</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="53.858268" y="160.71025" transform="rotate(-0 53.858268 160.71025)">Microsoft Entra ID → Directorio del proyecto</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="53.858268" y="177.01954" transform="rotate(-0 53.858268 177.01954)">Directory (tenant) ID; usuarios miembros o invitados admitidos.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="53.858268" y="248.584265" transform="rotate(-0 53.858268 248.584265)">App registration: Streamlit</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 264.893556)">Application (client) ID + client secret del frontend.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 276.851212)">Web redirect: localhost:8501/oauth2callback.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 288.808868)">Destino: .streamlit/secrets.toml [auth.microsoft].</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="450.708661" y="248.584265" transform="rotate(-0 450.708661 248.584265)">App registration: FastAPI</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 264.893556)">Application (client) ID distinto; tokens v2 para la API.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 276.851212)">Expose an API: api://&lt;api-id&gt;/access_as_user.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(450.708661 289.086993)">Client secret API → APP_ENTRA_API_CLIENT_SECRET.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="53.858268" y="404.489777" transform="rotate(-0 53.858268 404.489777)">Permiso delegado del frontend → FastAPI</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="53.858268" y="420.799067" transform="rotate(-0 53.858268 420.799067)">Streamlit solicita access_as_user; preautorizar frontend o conceder consentimiento.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="53.858268" y="498.033084" transform="rotate(-0 53.858268 498.033084)">Permisos delegados de FastAPI → Azure + consentimiento de administrador</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 514.342375)">Search user_impersonation + Microsoft Cognitive Services user_impersonation.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(53.858268 527.098156)">Habilitan OBO; los roles RBAC del usuario autorizan después los datos.</text>
   </g>
  </g>
