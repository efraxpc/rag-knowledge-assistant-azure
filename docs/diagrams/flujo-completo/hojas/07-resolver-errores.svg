   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="311.811024" y="301.466551" transform="rotate(-0 311.811024 301.466551)">Revisar su valor</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(311.811024 319.080722)">Guarda el valor del secreto del registro</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(311.811024 331.636261)">Streamlit. El ID del secreto no sirve.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="400.679149" transform="rotate(-0 62.362205 400.679149)">Sesión caducada</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="417.913398" transform="rotate(-0 62.362205 417.913398)">La API responde 401</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="311.811024" y="400.679149" transform="rotate(-0 311.811024 400.679149)">Volver a iniciar sesión</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(311.811024 418.71332)">Cierra sesión, entra de nuevo y repite la</text>
