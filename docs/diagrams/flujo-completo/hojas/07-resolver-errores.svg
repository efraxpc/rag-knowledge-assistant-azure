   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="499.891748" transform="rotate(-0 62.362205 499.891748)">Falla el acceso delegado</text>
   </g>
   <g id="text_21">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="517.125997" transform="rotate(-0 62.362205 517.125997)">delegated_authentication_failed</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="311.811024" y="499.891748" transform="rotate(-0 311.811024 499.891748)">Revisar la API</text>
   </g>
   <g id="text_23">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(311.811024 517.505918)">Revisa el secreto de la API y la</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(311.811024 530.607457)">autorización para acceder al servicio</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(311.811024 543.162997)">correcto.</text>
   </g>
   <g id="text_24">
