   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="311.811024" y="202.253952" transform="rotate(-0 311.811024 202.253952)">Añadir la cuenta</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(311.811024 219.868123)">Usa una cuenta del directorio o acepta</text>
