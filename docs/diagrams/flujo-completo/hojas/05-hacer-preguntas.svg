   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="48.188976" y="55.478976" transform="rotate(-0 48.188976 55.478976)">RAG MANUAL / GUÍA PARA IMPRIMIR</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="48.188976" y="87.410829" transform="rotate(-0 48.188976 87.410829)">Hacer una pregunta</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="48.188976" y="116.514817" transform="rotate(-0 48.188976 116.514817)">Primero se busca en el documento; después se prepara la respuesta.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="48.188976" y="811.877964" transform="rotate(-0 48.188976 811.877964)">Flujo del proyecto · 13 septiembre 2026 · A4 vertical</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #172c42" x="547.086614" y="812.637808" transform="rotate(-0 547.086614 812.637808)">5 / 8</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="177.242141" transform="rotate(-0 62.362205 177.242141)">1 Envías una pregunta</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="195.116156" transform="rotate(-0 62.362205 195.116156)">Streamlit manda la pregunta, el documento elegido y tu token a la API.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="267.450803" transform="rotate(-0 62.362205 267.450803)">2 La API valida el acceso y busca</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 285.824817)">Pide acceso a Search y OpenAI en tu nombre. Busca por texto hasta cinco partes</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 299.576122)">del documento.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172c42" x="297.637795" y="387.222848" transform="rotate(-0 297.637795 387.222848)">¿Hay fragmentos?</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="119.055118" y="404.448831" transform="rotate(-0 119.055118 404.448831)">No</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="433.700787" y="404.448831" transform="rotate(-0 433.700787 404.448831)">Sí</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="474.879937" transform="rotate(-0 62.362205 474.879937)">3a No hay información</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 493.213951)">La API avisa que no encontró</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 506.965256)">información suficiente. No llama</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 520.716561)">al modelo.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="311.811024" y="474.379937" transform="rotate(-0 311.811024 474.379937)">3b OpenAI recibe el caso</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(311.811024 492.753951)">Recibe la pregunta y los fragmentos.</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(311.811024 506.505256)">Se le pide usar ese texto y citar sus</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(311.811024 520.256561)">fuentes.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="311.811024" y="621.781511" transform="rotate(-0 311.811024 621.781511)">4 El modelo responde</text>
   </g>
   <g id="text_18">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(311.811024 640.155526)">Redacta una respuesta basada en los</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(311.811024 653.906831)">fragmentos recibidos.</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="729.498047" transform="rotate(-0 62.362205 729.498047)">5 Ves el resultado en la home</text>
   </g>
   <g id="text_20">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="747.872061" transform="rotate(-0 62.362205 747.872061)">La API devuelve la respuesta y las fuentes; Streamlit muestra la respuesta.</text>
   </g>
  </g>
 </g>
