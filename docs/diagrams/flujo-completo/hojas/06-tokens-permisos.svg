   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="48.188976" y="55.478976" transform="rotate(-0 48.188976 55.478976)">RAG MANUAL / GUÍA PARA IMPRIMIR</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="48.188976" y="88.462704" transform="rotate(-0 48.188976 88.462704)">Qué permite cada token</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(48.188976 116.074817)">La carga usa Search. Las preguntas usan Search y OpenAI. En ambos casos, se revisan</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(48.188976 129.228239)">tus permisos.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="48.188976" y="811.877964" transform="rotate(-0 48.188976 811.877964)">Flujo del proyecto · 13 septiembre 2026 · A4 vertical</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #172c42" x="547.086614" y="812.637808" transform="rotate(-0 547.086614 812.637808)">6 / 8</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="176.742141" transform="rotate(-0 62.362205 176.742141)">1 Streamlit entrega tu token a FastAPI</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 195.576156)">Este token está destinado a la API. FastAPI comprueba que sea auténtico, no</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 209.925461)">haya vencido y permita la operación.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="281.624031" transform="rotate(-0 62.362205 281.624031)">2 FastAPI pide acceso en tu nombre</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 300.458046)">Envía a Entra tu token y el secreto de la API. Este intercambio se llama</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 314.20935)">On-Behalf-Of, o «en nombre de».</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="426.19096" transform="rotate(-0 62.362205 426.19096)">3a Token para Search</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 444.564975)">Entra entrega un token destinado</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 458.914279)">al servicio de búsqueda.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="325.984252" y="426.19096" transform="rotate(-0 325.984252 426.19096)">3b Token para OpenAI</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(325.984252 444.564975)">Entra entrega otro token para el</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(325.984252 458.316279)">recurso Microsoft Cognitive</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(325.984252 472.067584)">Services.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="565.088598" transform="rotate(-0 62.362205 565.088598)">4a Guardar o buscar</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 583.462613)">Search comprueba si el usuario</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 597.213917)">puede leer o guardar texto.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="325.984252" y="565.088598" transform="rotate(-0 325.984252 565.088598)">4b Generar respuesta</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(325.984252 583.462613)">OpenAI revisa si el usuario tiene</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(325.984252 597.213917)">permiso para usar el modelo.</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="687.478362" transform="rotate(-0 62.362205 687.478362)">Los nombres que verás en la configuración</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 704.592533)">Search: https://search.azure.com/.default</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 717.148072)">OpenAI: https://cognitiveservices.azure.com/.default</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 730.249611)">Cognitive Services es el recurso de autenticación que usa OpenAI.</text>
   </g>
  </g>
 </g>
