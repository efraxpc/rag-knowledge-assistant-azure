   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="48.188976" y="55.478976" transform="rotate(-0 48.188976 55.478976)">RAG MANUAL / GUÍA PARA IMPRIMIR</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="48.188976" y="87.582704" transform="rotate(-0 48.188976 87.582704)">Publicar una nueva versión</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="48.188976" y="116.074817" transform="rotate(-0 48.188976 116.074817)">Este recorrido ocurre al publicar cambios. No se ejecuta con cada pregunta del usuario.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="48.188976" y="811.877964" transform="rotate(-0 48.188976 811.877964)">Flujo del proyecto · 13 septiembre 2026 · A4 vertical</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #172c42" x="547.086614" y="812.637808" transform="rotate(-0 547.086614 812.637808)">8 / 8</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="177.242141" transform="rotate(-0 62.362205 177.242141)">1 GitHub comprueba el código</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 195.116156)">Ejecuta pruebas y revisa su formato. Las propuestas de cambio pasan por este</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 208.867461)">control.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="308.976378" y="242.114184" transform="rotate(-0 308.976378 242.114184)">Al actualizar main o iniciar el flujo manual</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="290.127968" transform="rotate(-0 62.362205 290.127968)">2 Prueba documentos y preguntas conocidos</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 308.501983)">Carga documentos de prueba en un espacio separado y genera respuestas con</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 322.253287)">la versión nueva.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="392.175212" transform="rotate(-0 62.362205 392.175212)">3 Otro modelo revisa las respuestas</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 411.009227)">Puntúa de 1 a 5 el apoyo en los documentos, la relevancia, la información</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 424.760531)">cubierta y las citas. Guarda un informe.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(244.271506 543.545153)">¿Todos los casos</text>
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(232.883811 556.974638)">cumplen el mínimo?</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="107.716535" y="594.370091" transform="rotate(-0 107.716535 594.370091)">No</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="436.535433" y="594.370091" transform="rotate(-0 436.535433 594.370091)">Sí</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="655.797259" transform="rotate(-0 62.362205 655.797259)">4a Se detiene</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 674.171274)">El equipo revisa el informe,</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 687.922579)">corrige y vuelve a probar.</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="314.645669" y="655.797259" transform="rotate(-0 314.645669 655.797259)">4b Se publica la API</text>
   </g>
   <g id="text_19">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(314.645669 674.171274)">Empaqueta la API y la actualiza en</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(314.645669 687.922579)">Azure Container Apps.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(48.188976 747.840957)">Mínimo actual: 4 en cada nota y ninguna afirmación importante sin respaldo.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(48.188976 759.798613)">Este despliegue publica FastAPI; el alojamiento de Streamlit se configura aparte.</text>
   </g>
  </g>
 </g>
