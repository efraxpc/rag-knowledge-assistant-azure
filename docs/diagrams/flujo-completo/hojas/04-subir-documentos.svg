   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="48.188976" y="55.478976" transform="rotate(-0 48.188976 55.478976)">RAG MANUAL / GUÍA PARA IMPRIMIR</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="48.188976" y="87.582704" transform="rotate(-0 48.188976 87.582704)">Guardar un documento</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="48.188976" y="116.074817" transform="rotate(-0 48.188976 116.074817)">Seleccionar el archivo no lo guarda: debes pulsar «Procesar y guardar».</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="48.188976" y="811.877964" transform="rotate(-0 48.188976 811.877964)">Flujo del proyecto · 13 septiembre 2026 · A4 vertical</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #172c42" x="547.086614" y="812.637808" transform="rotate(-0 547.086614 812.637808)">4 / 8</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="62.362205" y="179.196865" transform="rotate(-0 62.362205 179.196865)">1</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="176.742141" transform="rotate(-0 90.708661 176.742141)">Seleccionas PDF, TXT o Markdown</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(90.708661 195.116156)">El archivo puede pesar hasta 10 MiB. El PDF debe contener texto</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(90.708661 208.867461)">seleccionable.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="62.362205" y="275.574818" transform="rotate(-0 62.362205 275.574818)">2</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="273.120094" transform="rotate(-0 90.708661 273.120094)">Pulsas «Procesar y guardar»</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="291.954109" transform="rotate(-0 90.708661 291.954109)">Streamlit envía a FastAPI el archivo y tu token de acceso.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="62.362205" y="371.952771" transform="rotate(-0 62.362205 371.952771)">3</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="369.498047" transform="rotate(-0 90.708661 369.498047)">La API comprueba el acceso</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="387.872061" transform="rotate(-0 90.708661 387.872061)">Valida tu token y pide a Entra acceso a Search en tu nombre. Ver hoja 6.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="62.362205" y="468.330723" transform="rotate(-0 62.362205 468.330723)">4</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="465.876" transform="rotate(-0 90.708661 465.876)">La API prepara el texto</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(90.708661 484.445874)">Extrae el texto y lo divide en partes pequeñas que repiten un poco de texto</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(90.708661 498.197178)">para mantener el contexto.</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="62.362205" y="564.708676" transform="rotate(-0 62.362205 564.708676)">5</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="562.253952" transform="rotate(-0 90.708661 562.253952)">Search guarda los fragmentos</text>
   </g>
   <g id="text_20">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="581.087967" transform="rotate(-0 90.708661 581.087967)">Cada parte conserva el nombre del documento y, si existe, su página.</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="62.362205" y="661.086629" transform="rotate(-0 62.362205 661.086629)">6</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="658.631905" transform="rotate(-0 90.708661 658.631905)">La home confirma el resultado</text>
   </g>
   <g id="text_23">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="677.46592" transform="rotate(-0 90.708661 677.46592)">Ves cuántos fragmentos se guardaron. Ya puedes hacer una pregunta.</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="740.83663" transform="rotate(-0 62.362205 740.83663)">Qué se almacena</text>
   </g>
   <g id="text_25">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 758.4508)">Se guardan partes del texto. El original no se conserva; los escaneos no se convierten en</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 771.006339)">texto.</text>
   </g>
  </g>
