   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="48.188976" y="55.478976" transform="rotate(-0 48.188976 55.478976)">RAG MANUAL / GUÍA PARA IMPRIMIR</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="48.188976" y="87.582704" transform="rotate(-0 48.188976 87.582704)">Antes de empezar</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="48.188976" y="116.514817" transform="rotate(-0 48.188976 116.514817)">Se prepara al configurar el proyecto. Después puedes usarlo cada día.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="48.188976" y="811.877964" transform="rotate(-0 48.188976 811.877964)">Flujo del proyecto · 13 septiembre 2026 · A4 vertical</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #172c42" x="547.086614" y="812.637808" transform="rotate(-0 547.086614 812.637808)">2 / 8</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="62.362205" y="179.196865" transform="rotate(-0 62.362205 179.196865)">1</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="176.742141" transform="rotate(-0 90.708661 176.742141)">El administrador prepara Azure</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(90.708661 195.576156)">Prepara la búsqueda, un espacio para guardar texto y un modelo listo para</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(90.708661 209.327461)">responder.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="62.362205" y="275.574818" transform="rotate(-0 62.362205 275.574818)">2</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="273.120094" transform="rotate(-0 90.708661 273.120094)">Registra dos aplicaciones</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(90.708661 291.494109)">Una identifica a Streamlit y otra a FastAPI. Cada una tiene su propia</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(90.708661 305.245413)">contraseña, llamada secreto.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="62.362205" y="371.952771" transform="rotate(-0 62.362205 371.952771)">3</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="369.498047" transform="rotate(-0 90.708661 369.498047)">Da acceso a las personas</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="388.332061" transform="rotate(-0 90.708661 388.332061)">La cuenta debe pertenecer al directorio de Entra o aceptar una invitación.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="62.362205" y="468.330723" transform="rotate(-0 62.362205 468.330723)">4</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="465.876" transform="rotate(-0 90.708661 465.876)">Autoriza a la API y al usuario</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(90.708661 484.710014)">Permite que la API actúe en tu nombre y que tu cuenta use la búsqueda y el</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(90.708661 498.461319)">modelo.</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="62.362205" y="564.708676" transform="rotate(-0 62.362205 564.708676)">5</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="562.253952" transform="rotate(-0 90.708661 562.253952)">Configura y arranca tu equipo</text>
   </g>
   <g id="text_20">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="90.708661" y="580.627967" transform="rotate(-0 90.708661 580.627967)">Completa .env y .streamlit/secrets.toml. Ejecuta ./scripts/run_local.sh.</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="62.362205" y="672.805133" transform="rotate(-0 62.362205 672.805133)">Permisos que usa este proyecto</text>
   </g>
   <g id="text_22">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 690.799226)">Para documentos: Search Index Data Contributor.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 703.952648)">Para respuestas: Cognitive Services OpenAI User.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(62.362205 717.10607)">Abre http://localhost:8501 para empezar.</text>
   </g>
  </g>
 </g>
