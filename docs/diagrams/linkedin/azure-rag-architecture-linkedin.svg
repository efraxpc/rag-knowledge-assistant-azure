<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">RAG seguro no Azure — arquitetura técnica</title>
  <desc id="description">Infográfico técnico para LinkedIn sobre uma aplicação RAG no Azure, desde o login com Microsoft Entra ID até a recuperação no Azure AI Search e a geração com Azure OpenAI, incluindo segurança, observabilidade e entrega contínua.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101F"/>
      <stop offset="0.54" stop-color="#081B31"/>
      <stop offset="1" stop-color="#0B2B4A"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0873BB"/>
      <stop offset="1" stop-color="#0A9DD2"/>
    </linearGradient>
    <linearGradient id="searchCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#075D9C"/>
      <stop offset="1" stop-color="#0A83C4"/>
    </linearGradient>
    <linearGradient id="aiCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D3DB4"/>
      <stop offset="1" stop-color="#735DDB"/>
    </linearGradient>
    <linearGradient id="identityCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123C3C"/>
      <stop offset="1" stop-color="#15564F"/>
    </linearGradient>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#20BFFF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#20BFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#8D77FF" stop-opacity=".17"/>
      <stop offset="1" stop-color="#8D77FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7BB8D9" stroke-width=".7" opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#010712" flood-opacity=".42"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#010712" flood-opacity=".3"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#61D6FF"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#B8A9FF"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7EA0BE"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .display { fill:#F8FBFF; font-size:50px; font-weight:780; letter-spacing:-1.3px; }
      .subtitle { fill:#B9CDE0; font-size:18px; font-weight:430; }
      .eyebrow { fill:#65D7FF; font-size:12px; font-weight:800; letter-spacing:2.3px; }
      .section { fill:#70D7FF; font-size:13px; font-weight:800; letter-spacing:1.8px; }
      .step-num { fill:#061C2D; font-size:14px; font-weight:850; }
      .kicker { fill:#9FBAD2; font-size:10.5px; font-weight:750; letter-spacing:1.1px; }
      .title { fill:#FAFDFF; font-size:20px; font-weight:740; }
      .body { fill:#BED2E4; font-size:13px; font-weight:440; }
      .small { fill:#A8C1D7; font-size:11px; font-weight:480; }
      .white-body { fill:#EAF8FF; font-size:13px; font-weight:470; }
      .white-small { fill:#D4EDF8; font-size:11px; font-weight:520; }
      .mono { fill:#D8F2FC; font-family:"SFMono-Regular",Consolas,monospace; font-size:11px; font-weight:600; }
      .chip { fill:#F1FAFF; font-size:10.5px; font-weight:720; }
      .label { fill:#9DBDD6; font-size:10px; font-weight:720; letter-spacing:.35px; }
      .footer { fill:#7696B3; font-size:10px; font-weight:620; letter-spacing:.25px; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect y="170" width="1080" height="1180" fill="url(#grid)"/>
  <circle cx="1010" cy="90" r="255" fill="url(#glowBlue)"/>
  <circle cx="20" cy="760" r="300" fill="url(#glowPurple)"/>

  <!-- Cabeçalho -->
  <g aria-label="Cabeçalho">
    <rect x="50" y="34" width="292" height="30" rx="15" fill="#0B3553" stroke="#216B95"/>
    <circle cx="69" cy="49" r="5" fill="#47D1FF"/>
    <text x="83" y="53" class="eyebrow">ARQUITETURA TÉCNICA · RAG</text>
    <text x="50" y="116" class="display">RAG seguro no Azure</text>
    <text x="50" y="151" class="subtitle">Do login à resposta fundamentada — com identidade delegada no fluxo de dados</text>
    <g transform="translate(919 37)">
      <rect width="111" height="102" rx="22" fill="#0A2A46" stroke="#275A7B"/>
      <path d="M18 58 39 14h25L43 58Z" fill="#2AABFF"/>
      <path d="m51 58 14-25 24 25Z" fill="#75DDFF"/>
      <text x="55.5" y="82" text-anchor="middle" class="footer">AZURE · AI</text>
    </g>
  </g>

  <!-- 01 Identidade -->
  <text x="50" y="196" class="section">CAMADA DE ACESSO · IDENTIDADE DO USUÁRIO</text>

  <path d="M333 280 H390" fill="none" stroke="#61D6FF" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M690 280 H747" fill="none" stroke="#B8A9FF" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="361" y="268" text-anchor="middle" class="label">OIDC</text>
  <text x="718" y="268" text-anchor="middle" class="label">TOKEN</text>

  <g filter="url(#softShadow)" aria-label="Frontend Streamlit">
    <rect x="50" y="218" width="283" height="126" rx="20" fill="#102D46" stroke="#2D86B5" stroke-width="1.4"/>
    <circle cx="85" cy="254" r="18" fill="#164663"/>
    <path d="M76 249h18v12h-9l-6 5v-5h-3Z" fill="none" stroke="#7CE4FF" stroke-width="1.8" stroke-linejoin="round"/>
    <rect x="292" y="233" width="25" height="25" rx="12.5" fill="#BAEEFF"/>
    <text x="304.5" y="251" text-anchor="middle" class="step-num">1</text>
    <text x="115" y="249" class="kicker">CLIENTE</text>
    <text x="115" y="273" class="title">Streamlit</text>
    <text x="70" y="304" class="body">Login, upload, pergunta e fontes</text>
    <rect x="70" y="316" width="174" height="17" rx="8.5" fill="#174B69"/>
    <text x="157" y="328" text-anchor="middle" class="chip">scope: access_as_user</text>
  </g>

  <g filter="url(#softShadow)" aria-label="Microsoft Entra ID">
    <rect x="390" y="218" width="300" height="126" rx="20" fill="url(#identityCard)" stroke="#39B89B" stroke-width="1.4"/>
    <circle cx="426" cy="254" r="18" fill="#1A6359"/>
    <path d="M426 241 436 245v8c0 7-4 12-10 16-6-4-10-9-10-16v-8Z" fill="none" stroke="#91F8D7" stroke-width="1.8"/>
    <path d="m421 253 4 4 7-8" fill="none" stroke="#91F8D7" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="649" y="233" width="25" height="25" rx="12.5" fill="#BAFFE9"/>
    <text x="661.5" y="251" text-anchor="middle" class="step-num">2</text>
    <text x="456" y="249" class="kicker">IDENTITY PROVIDER</text>
    <text x="456" y="273" class="title">Microsoft Entra ID</text>
    <text x="410" y="304" class="body">OIDC · OAuth 2.0 · consentimento</text>
    <text x="410" y="326" class="small">Frontend app + API confidencial</text>
  </g>

  <g filter="url(#softShadow)" aria-label="Tokens delegados">
    <rect x="747" y="218" width="283" height="126" rx="20" fill="#282747" stroke="#786BDD" stroke-width="1.4"/>
    <circle cx="782" cy="254" r="18" fill="#474080"/>
    <path d="M774 254h17m-5-5 5 5-5 5" fill="none" stroke="#D6CEFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="989" y="233" width="25" height="25" rx="12.5" fill="#E6E1FF"/>
    <text x="1001.5" y="251" text-anchor="middle" class="step-num">3</text>
    <text x="812" y="249" class="kicker">DELEGAÇÃO</text>
    <text x="812" y="273" class="title">Access token + OBO</text>
    <text x="767" y="304" class="body">JWT RS256 · JWKS · aud/iss/scp/azp</text>
    <text x="767" y="326" class="small">Tokens de Search e Cognitive Services</text>
  </g>

  <!-- Conexão ao runtime -->
  <path d="M888 344 V372 H540 V398" fill="none" stroke="#B8A9FF" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arrowPurple)"/>
  <rect x="639" y="360" width="178" height="23" rx="11.5" fill="#17243E" stroke="#574E94"/>
  <text x="728" y="375" text-anchor="middle" class="label">BEARER JWT + OBO</text>

  <!-- 02 Orquestração -->
  <g filter="url(#shadow)" aria-label="API RAG em Azure Container Apps">
    <rect x="50" y="398" width="980" height="218" rx="26" fill="url(#hero)"/>
    <circle cx="102" cy="451" r="31" fill="#08609A" opacity=".82"/>
    <path d="M83 460c-8 0-13-5-13-11s5-11 11-12c3-8 10-12 18-12 10 0 18 7 19 16 7 1 11 5 11 10s-5 9-11 9Z" fill="none" stroke="#E8FAFF" stroke-width="2.2"/>
    <path d="m91 440-6 8 6 8m18-16 6 8-6 8m-6-19-6 22" fill="none" stroke="#E8FAFF" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="978" y="418" width="31" height="31" rx="15.5" fill="#DDF8FF"/>
    <text x="993.5" y="440" text-anchor="middle" class="step-num">4</text>
    <text x="151" y="431" class="white-small">AZURE CONTAINER APPS · CONSUMPTION</text>
    <text x="151" y="463" fill="#FFFFFF" font-size="27" font-weight="760">FastAPI + LangGraph</text>
    <text x="151" y="489" class="white-body">TLS público → porta 8000 · 0–3 réplicas · autenticação obrigatória</text>

    <rect x="694" y="426" width="296" height="92" rx="14" fill="#07638F" fill-opacity=".74" stroke="#72DFFF" stroke-opacity=".55"/>
    <text x="713" y="449" class="white-small">CONTRATO HTTP · /api/v1</text>
    <text x="713" y="472" class="mono">POST /documents/upload</text>
    <text x="713" y="493" class="mono">POST /queries/answer</text>
    <text x="713" y="511" class="white-small">PDF · TXT · MD · limite 10 MiB</text>

    <path d="M99 558 H969" stroke="#BFEFFF" stroke-opacity=".34" stroke-width="1"/>
    <g transform="translate(83 569)">
      <rect width="143" height="28" rx="14" fill="#DDF8FF" fill-opacity=".16"/>
      <text x="71.5" y="19" text-anchor="middle" class="chip">VALIDAR JWT</text>
      <path d="M150 14h31" stroke="#E5F9FF" stroke-opacity=".62" marker-end="url(#arrowBlue)"/>
      <rect x="188" width="143" height="28" rx="14" fill="#DDF8FF" fill-opacity=".16"/>
      <text x="259.5" y="19" text-anchor="middle" class="chip">RECUPERAR</text>
      <path d="M338 14h31" stroke="#E5F9FF" stroke-opacity=".62" marker-end="url(#arrowBlue)"/>
      <rect x="376" width="143" height="28" rx="14" fill="#DDF8FF" fill-opacity=".16"/>
      <text x="447.5" y="19" text-anchor="middle" class="chip">CRIAR CONTEXTO</text>
      <path d="M526 14h31" stroke="#E5F9FF" stroke-opacity=".62" marker-end="url(#arrowBlue)"/>
      <rect x="564" width="143" height="28" rx="14" fill="#DDF8FF" fill-opacity=".16"/>
      <text x="635.5" y="19" text-anchor="middle" class="chip">GERAR</text>
      <path d="M714 14h31" stroke="#E5F9FF" stroke-opacity=".62" marker-end="url(#arrowBlue)"/>
      <rect x="752" width="143" height="28" rx="14" fill="#DDF8FF" fill-opacity=".16"/>
      <text x="823.5" y="19" text-anchor="middle" class="chip">VALIDAR CITAÇÕES</text>
    </g>
  </g>

  <!-- 03 Dados e geração -->
  <text x="50" y="664" class="section">CAMADA DE IA · RECUPERAÇÃO + GERAÇÃO</text>
  <path d="M540 616 V646 H285 V689" fill="none" stroke="#61D6FF" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M540 646 H795 V689" fill="none" stroke="#B8A9FF" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="376" y="640" class="label">TOKEN SEARCH</text>
  <text x="666" y="640" class="label">TOKEN AI</text>

  <g filter="url(#shadow)" aria-label="Azure AI Search">
    <rect x="50" y="689" width="470" height="218" rx="24" fill="url(#searchCard)"/>
    <circle cx="98" cy="739" r="28" fill="#075185"/>
    <circle cx="94" cy="735" r="10" fill="none" stroke="#E5F8FF" stroke-width="2.3"/>
    <path d="m101 742 11 11" stroke="#E5F8FF" stroke-width="2.3" stroke-linecap="round"/>
    <text x="140" y="722" class="white-small">RETRIEVAL · DATA PLANE</text>
    <text x="140" y="751" class="title">Azure AI Search</text>
    <text x="140" y="776" class="white-body">Índice: rag-text-chunks</text>
    <rect x="74" y="800" width="422" height="78" rx="13" fill="#064E80" fill-opacity=".75"/>
    <text x="94" y="824" class="mono">search_text=question · filter=document_id</text>
    <text x="94" y="847" class="white-body">top_k=5 · conteúdo + fonte + página</text>
    <text x="94" y="868" class="white-small">Ingestão: chunks 1.000 · overlap 200</text>
    <rect x="369" y="711" width="127" height="25" rx="12.5" fill="#DDF7FF" fill-opacity=".17"/>
    <text x="432.5" y="728" text-anchor="middle" class="chip">LOCAL AUTH OFF</text>
  </g>

  <g filter="url(#shadow)" aria-label="Azure OpenAI">
    <rect x="560" y="689" width="470" height="218" rx="24" fill="url(#aiCard)"/>
    <circle cx="608" cy="739" r="28" fill="#4938A2"/>
    <path d="m608 719 4 13 13 4-13 4-4 13-4-13-13-4 13-4Z" fill="none" stroke="#F2EDFF" stroke-width="2.1"/>
    <text x="650" y="722" class="white-small">GENERATION · OPENAI V1</text>
    <text x="650" y="751" class="title">Azure OpenAI</text>
    <text x="650" y="776" class="white-body">general · gpt-5-mini · 2025-08-07</text>
    <rect x="584" y="800" width="422" height="78" rx="13" fill="#45369B" fill-opacity=".72"/>
    <text x="604" y="824" class="mono">POST /openai/v1/chat/completions</text>
    <text x="604" y="847" class="white-body">Pergunta + contexto ≤12.000 caracteres</text>
    <text x="604" y="868" class="white-small">Resposta fundamentada → reparo de citações</text>
    <rect x="870" y="711" width="136" height="25" rx="12.5" fill="#F0ECFF" fill-opacity=".17"/>
    <text x="938" y="728" text-anchor="middle" class="chip">OBO · SEM API KEY</text>
  </g>

  <!-- 04 Controles -->
  <text x="50" y="955" class="section">CONTROLES · SEGURANÇA + OPERAÇÃO</text>
  <g aria-label="Controles de segurança e operação">
    <rect x="50" y="976" width="303" height="96" rx="18" fill="#102D45" stroke="#2C87B5"/>
    <circle cx="80" cy="1005" r="14" fill="#174E6D"/>
    <path d="M74 1005h12m-6-6v12" stroke="#8CE8FF" stroke-width="1.8" stroke-linecap="round"/>
    <text x="104" y="1001" class="kicker">RBAC DELEGADO</text>
    <text x="104" y="1024" class="title">Privilégio mínimo</text>
    <text x="70" y="1051" class="small">Search Data Contributor · OpenAI User</text>

    <rect x="389" y="976" width="302" height="96" rx="18" fill="#173638" stroke="#379F8A"/>
    <circle cx="419" cy="1005" r="14" fill="#1D5A52"/>
    <path d="M413 1005h12m-9-5 7 10" stroke="#9AF5DA" stroke-width="1.8" stroke-linecap="round"/>
    <text x="443" y="1001" class="kicker">MANAGED IDENTITY</text>
    <text x="443" y="1024" class="title">AcrPull somente</text>
    <text x="409" y="1051" class="small">A identidade da app não substitui o usuário</text>

    <rect x="727" y="976" width="303" height="96" rx="18" fill="#282747" stroke="#786BDD"/>
    <circle cx="757" cy="1005" r="14" fill="#474080"/>
    <path d="M750 1011v-7m7 7v-13m7 13v-18" stroke="#D9D1FF" stroke-width="1.8" stroke-linecap="round"/>
    <text x="781" y="1001" class="kicker">OBSERVABILIDADE</text>
    <text x="781" y="1024" class="title">Log Analytics</text>
    <text x="747" y="1051" class="small">Azure Monitor · retenção de logs: 30 dias</text>
  </g>

  <!-- 05 Entrega -->
  <text x="50" y="1122" class="section">PLATAFORMA · ENTREGA CONTÍNUA COM QUALITY GATE</text>
  <rect x="50" y="1143" width="980" height="133" rx="22" fill="#0C1E32" stroke="#304E68"/>

  <path d="M222 1208 H269" stroke="#7EA0BE" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <path d="M414 1208 H461" stroke="#7EA0BE" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <path d="M606 1208 H653" stroke="#7EA0BE" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <path d="M798 1208 H845" stroke="#7EA0BE" stroke-width="2" marker-end="url(#arrowMuted)"/>

  <g aria-label="GitHub Actions">
    <circle cx="149" cy="1208" r="37" fill="#152333" stroke="#54687C"/>
    <path d="M135 1208h28m-14-14v28" stroke="#E9F3FA" stroke-width="2" stroke-linecap="round"/>
    <text x="149" y="1260" text-anchor="middle" class="small">GitHub Actions</text>
  </g>
  <g aria-label="OIDC federation">
    <circle cx="341" cy="1208" r="37" fill="#1D2B4C" stroke="#5D73CA"/>
    <path d="M328 1208h26m-7-7 7 7-7 7" fill="none" stroke="#C9D4FF" stroke-width="2" stroke-linecap="round"/>
    <text x="341" y="1260" text-anchor="middle" class="small">OIDC federation</text>
  </g>
  <g aria-label="Quality gate">
    <circle cx="533" cy="1208" r="37" fill="#322D5B" stroke="#8273DF"/>
    <path d="m533 1191 4 12 12 4-12 4-4 12-4-12-12-4 12-4Z" fill="none" stroke="#E4DEFF" stroke-width="1.8"/>
    <text x="533" y="1260" text-anchor="middle" class="small">GPT-5 judge · gate ≥4</text>
  </g>
  <g aria-label="Azure Container Registry">
    <circle cx="725" cy="1208" r="37" fill="#123451" stroke="#2E83B5"/>
    <rect x="710" y="1198" width="30" height="23" rx="3" fill="none" stroke="#A9E9FF" stroke-width="2"/>
    <path d="M716 1192h18v6h-18Z" fill="none" stroke="#A9E9FF" stroke-width="2"/>
    <text x="725" y="1260" text-anchor="middle" class="small">ACR · imagem OCI</text>
  </g>
  <g aria-label="Azure Container Apps">
    <circle cx="917" cy="1208" r="37" fill="#123B57" stroke="#31A0CE"/>
    <path d="M899 1216c-7 0-11-4-11-9s4-9 9-10c2-7 8-10 15-10 8 0 15 6 16 13 5 0 9 4 9 8s-4 8-9 8Z" fill="none" stroke="#A9EDFF" stroke-width="2"/>
    <text x="917" y="1260" text-anchor="middle" class="small">Container Apps</text>
  </g>

  <rect x="50" y="1300" width="980" height="27" rx="13.5" fill="#10253B" stroke="#294C68"/>
  <text x="540" y="1318" text-anchor="middle" class="footer">TERRAFORM PROVISIONA · KEY VAULT PREPARADO FORA DO RUNTIME · ENDPOINTS PÚBLICOS HTTPS</text>
  <text x="50" y="1342" class="footer">FASTAPI · LANGGRAPH · ENTRA ID · AZURE AI SEARCH · AZURE OPENAI · CONTAINER APPS · ACR · LOG ANALYTICS</text>
</svg>
