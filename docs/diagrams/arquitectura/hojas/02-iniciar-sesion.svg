   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="87.874016" y="179.003951" transform="rotate(-0 87.874016 179.003951)">Streamlit: abres la pantalla</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="87.874016" y="196.051903" transform="rotate(-0 87.874016 196.051903)">Entras en localhost:8501 y pulsas Iniciar sesión con Microsoft.</text>
   </g>
   <g id="text_9">
