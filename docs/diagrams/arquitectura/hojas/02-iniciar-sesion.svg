   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="87.874016" y="451.129935" transform="rotate(-0 87.874016 451.129935)">Streamlit: muestra la home</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="87.874016" y="468.177887" transform="rotate(-0 87.874016 468.177887)">Vuelves a la página principal, donde aparece Subir documentos.</text>
