   <g id="text_18">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="612.283465" y="185.246078" transform="rotate(-0 612.283465 185.246078)">Microsoft Entra ID</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(612.283465 202.860249)">Es la puerta de acceso de</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(612.283465 215.415788)">Microsoft. Comprueba tu</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(612.283465 227.971327)">identidad y entrega pases para</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(612.283465 240.526866)">las aplicaciones.</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="612.283465" y="341.15159" transform="rotate(-0 612.283465 341.15159)">El pase para la API</text>
   </g>
   <g id="text_21">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(612.283465 359.185761)">La pantalla lo envía al cargar un</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(612.283465 371.7413)">archivo o hacer una pregunta.</text>
   </g>
