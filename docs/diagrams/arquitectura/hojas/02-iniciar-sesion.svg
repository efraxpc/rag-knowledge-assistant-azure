   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="87.874016" y="269.712612" transform="rotate(-0 87.874016 269.712612)">Microsoft Entra ID: comprueba tu cuenta</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="87.874016" y="286.760564" transform="rotate(-0 87.874016 286.760564)">Inicias sesión con una cuenta admitida en el directorio del proyecto.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24567e" x="68.031496" y="384.295155" transform="rotate(-0 68.031496 384.295155)">3</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="87.874016" y="360.421273" transform="rotate(-0 87.874016 360.421273)">Streamlit + Entra ID: preparan el acceso a la API</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="87.874016" y="377.049226" transform="rotate(-0 87.874016 377.049226)">La pantalla obtiene un token: un pase temporal destinado a FastAPI.</text>
