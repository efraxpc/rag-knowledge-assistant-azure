   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="42.519685" y="53.610424" transform="rotate(-0 42.519685 53.610424)">RAG MANUAL / FLUJO DE LA APLICACIÓN Y AZURE</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="84.028371" transform="rotate(-0 42.519685 84.028371)">Qué hace cada parte de Azure</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="110.405525" transform="rotate(-0 42.519685 110.405525)">Cada pieza tiene un trabajo. Estas son las que usa o prepara el proyecto.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="42.519685" y="576.222451" transform="rotate(-0 42.519685 576.222451)">Flujo implementado · 13 septiembre 2026 · A4 horizontal</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #172c42" x="799.370079" y="576.602373" transform="rotate(-0 799.370079 576.602373)">5 / 5</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="42.519685" y="146.116153" transform="rotate(-0 42.519685 146.116153)">AL ENTRAR, CARGAR Y PREGUNTAR</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24567e" x="430.866142" y="146.116153" transform="rotate(-0 430.866142 146.116153)">AL EJECUTAR LA API PUBLICADA EN AZURE</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="56.692913" y="188.080724" transform="rotate(-0 56.692913 188.080724)">Microsoft Entra ID</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(56.692913 206.114895)">Comprueba tu identidad y entrega pases. Actúa al iniciar sesión</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(56.692913 218.670434)">y cuando la API pide acceso a Search u OpenAI.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="56.692913" y="287.293322" transform="rotate(-0 56.692913 287.293322)">Azure AI Search</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(56.692913 304.907493)">Guarda partes del documento durante la carga. Al preguntar,</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(56.692913 317.463032)">busca texto relacionado y lo devuelve a la API.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="56.692913" y="386.505921" transform="rotate(-0 56.692913 386.505921)">Azure OpenAI</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(56.692913 404.540092)">El modelo de chat redacta con el texto que envía la API.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(56.692913 417.641631)">También se usa otro modelo para evaluar calidad antes de</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(56.692913 430.19717)">publicar.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="56.692913" y="485.718519" transform="rotate(-0 56.692913 485.718519)">FastAPI: quien une las piezas</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(56.692913 503.33269)">En local corre en tu equipo; publicada, en Container Apps. Lleva</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(56.692913 515.888229)">las peticiones y los resultados entre pantalla y Azure.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="445.03937" y="188.080724" transform="rotate(-0 445.03937 188.080724)">Azure Container Apps</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(445.03937 205.694895)">Ejecuta la API en Azure y recibe las peticiones de la pantalla.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(445.03937 218.250434)">Streamlit necesita alojamiento por separado.</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="445.03937" y="287.293322" transform="rotate(-0 445.03937 287.293322)">Azure Container Registry</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(445.03937 304.907493)">Guarda el paquete de la API, llamado imagen. Container Apps lo</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(445.03937 318.009032)">descarga para ejecutar esa versión.</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="445.03937" y="386.505921" transform="rotate(-0 445.03937 386.505921)">Azure Log Analytics</text>
   </g>
   <g id="text_21">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(445.03937 404.120092)">Recoge registros del entorno de Container Apps. Sirven para</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(445.03937 417.221631)">revisar qué ocurrió cuando hay un problema.</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c42" x="445.03937" y="485.718519" transform="rotate(-0 445.03937 485.718519)">Azure Key Vault</text>
   </g>
   <g id="text_23">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(445.03937 503.75269)">Es un almacén de secretos preparado por Terraform. La API</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(445.03937 516.308229)">actual todavía no lo consulta directamente.</text>
   </g>
  </g>
 </g>
